baseURL = "https://parkyechan2979.github.io/portfolio/"
title = "YCP"

languageCode = "ko"
defaultContentLanguage = "ko"
enableEmoji = true
# 블로그 글이 없어 태그·분류 페이지가 비어 있으므로 생성하지 않음
disableKinds = ["taxonomy", "term"]

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "YCP"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "전북대학교 IT지능정보공학과 YCP의 웹개발 포트폴리오"
keywords = "포트폴리오,웹개발,HTML,CSS,JavaScript,전북대학교"
info = ["전북대학교 IT지능정보공학과 재학", "웹개발을 배우고 있습니다"]
avatarURL = "images/avatar.jpg"
avatarAlt = "YCP 프로필 사진: 해커톤 행사장에서 휴대폰으로 발표 화면을 촬영하는 뒷모습"
#gravatar = "john.doe@example.com"
dateFormat = "2006-01-02"
since = 2026
# Right To Left, shift content direction for languages such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 5
# Custom CSS
customCSS = ["css/custom.css"]
# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = ["js/custom.js"]

# Custom remote JS files
customRemoteJS = []

[[params.social]]
name = "GitHub"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/ParkYeChan2979"

